    <rect x="650" y="388" width="320" height="70" rx="3"/>
    <rect x="650" y="508" width="320" height="70" rx="3"/>
  </g>
  <rect x="85" y="234" width="350" height="70" rx="3" fill="#dcebdd" stroke="#81a386" stroke-width="2"/>
  <rect x="650" y="388" width="320" height="70" rx="3" fill="#f0e7d5" stroke="#c2a778" stroke-width="2"/>
  <g fill="#26372d" font-family="monospace" font-size="17">
    <text x="111" y="276">Map pointer</text>
    <text x="111" y="346">Properties pointer</text>
    <text x="111" y="416">Elements pointer</text>
    <text x="111" y="486">In-object slots</text>
    <text x="678" y="310">Map / Hidden class</text>
    <text x="678" y="430">Descriptor array</text>
    <text x="678" y="550">Transition table</text>
  </g>
  <g fill="#6f7d71" font-family="sans-serif" font-size="14">
