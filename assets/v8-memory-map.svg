  <text x="70" y="77" fill="#53745d" font-family="monospace" font-size="15" letter-spacing="2">V8 OBJECT MODEL / 01</text>
  <text x="70" y="131" fill="#26372d" font-family="sans-serif" font-size="38" font-weight="600">一个对象，几层结构</text>
  <text x="70" y="166" fill="#69756c" font-family="sans-serif" font-size="17">JSObject、隐藏类 Map 与属性存储</text>
  <g fill="#fafbf8" stroke="#b9c9b7" stroke-width="2">
    <rect x="85" y="234" width="350" height="70" rx="3"/>
    <rect x="85" y="304" width="350" height="70" rx="3"/>
    <rect x="85" y="374" width="350" height="70" rx="3"/>
    <rect x="85" y="444" width="350" height="70" rx="3"/>
