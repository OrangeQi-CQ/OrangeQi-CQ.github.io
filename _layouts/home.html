---
layout: default
---
<header>
  <h1>{{ site.title }}</h1>
  {%-if site.theme_config.show_description-%}
    <p>{{ site.description }}</p>
  {%-endif-%}
</header>

<!-- {%-include menu_item.html collection=site.data.menu.entries-%} -->

{% for tag in site.tags %}
  <h3>{{ tag[0] }}</h3>
  <ul>
    {% for post in tag[1] %}
      <!-- <li><a href="{{ post.url }}">{{ post.title }}</a></li> -->
    <!-- <li><a href="{{ post.url }}" style="color: blue;">{{ post.title }}</a></li> -->
    <a href="{{ post.url }}" style="color: blue;">{{ post.title }}</a> <br>
    {% endfor %}
  </ul>
{% endfor %}

{{ content }}
